name: CDK — CI (synth & diff)

on:
  pull_request:
    paths:
      - '**'
  push:
    branches:
      - 'main'
      - 'develop'

permissions:
  contents: read
  id-token: write   # required for OIDC if you use it

env:
  NODE_VERSION: '18'
  AWS_REGION: 'us-east-1'  # override via repository secrets or workflow_dispatch inputs if needed

jobs:
  synth-and-diff:
    name: Synth & Diff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build (if applicable)
        run: |
          npm run build --if-present

      # Optional: configure AWS credentials
      # Recommended: use OIDC and an IAM role with a trust policy for GitHub Actions.
      # Create a repository secret AWS_ROLE_TO_ASSUME with the role ARN.
      - name: Configure AWS credentials (OIDC / role)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Alternative (less recommended): use static credentials stored in repository secrets
      - name: Configure AWS credentials (access key) — fallback
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && !secrets.AWS_ROLE_TO_ASSUME }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK CLI version
        run: |
          npx cdk --version

      - name: CDK synth (all)
        run: |
          npx cdk synth --all

      - name: CDK diff (all)
        # cdk diff can exit non-zero when differences are found; we don't want the job to fail for that reason in PR checks
        run: |
          npx cdk diff --all || true
